server {
    listen 80;
    server_name crm.hominalhealthcare.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.hominalhealthcare.com;

    root /var/www/crm.hominalhealthcare.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/crm.hominalhealthcare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.hominalhealthcare.com/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /supabase-config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}

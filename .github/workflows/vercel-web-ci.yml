# Quality gate for vercel-web — typecheck + unit + API integration tests.
#
# `npm test` runs every `src/**/*.test.ts` file with Vitest. That includes:
#   - business / validation / service unit tests under src/{business,validation,services}
#   - HTTP route-handler integration tests under src/integration
#     (auth, RBAC matrix, idempotency replay, lifecycle E2E)
#
# All tests run hermetically with mocked Supabase + WhatsApp env (see
# vitest.config.ts), so no live infra is required in CI.
name: vercel-web CI

on:
  pull_request:
    paths:
      - "vercel-web/**"
      - ".github/workflows/vercel-web-ci.yml"
  push:
    branches: [main]
    paths:
      - "vercel-web/**"
      - ".github/workflows/vercel-web-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vercel-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests (business matrix + API route handlers + DTO contracts)
        run: npm test
        env:
          API_AUDIT_DISABLED: "true"

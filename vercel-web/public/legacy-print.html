<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hominal Print View</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#f8fafc; color:#0f172a; }
    .bar { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; background:#0f172a; color:#fff; position:sticky; top:0; z-index:5; }
    .actions { display:flex; gap:10px; }
    .btn { border:0; border-radius:8px; padding:10px 14px; font-weight:700; cursor:pointer; }
    .btn-primary { background:#2563eb; color:#fff; }
    .btn-ghost { background:#e2e8f0; color:#0f172a; }
    .content { min-height:calc(100vh - 56px); background:#fff; }
    .empty { padding:48px 24px; text-align:center; color:#475569; }
    @media print {
      .bar { display:none; }
      body { background:#fff; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div>Hominal Healthcare CRM Print View</div>
    <div class="actions">
      <button class="btn btn-primary" id="printBtn" type="button">Print</button>
      <button class="btn btn-ghost" id="backBtn" type="button">Back</button>
    </div>
  </div>
  <div class="content" id="content"></div>
  <script>
    (function(){
      var payload = '';
      var backUrl = '';
      var printKey = '';
      try {
        var params = new URLSearchParams(window.location.search || '');
        printKey = params.get('printKey') || '';
        payload = printKey ? (localStorage.getItem(printKey) || '') : '';
        backUrl = localStorage.getItem('HOMINAL_PRINT_RETURN_URL') || '/';
        if (printKey) localStorage.removeItem(printKey);
      } catch (e) {}
      var content = document.getElementById('content');
      if (!payload) {
        content.innerHTML = '<div class="empty">Nothing to print. Go back to the CRM and generate the PDF again.</div>';
      } else {
        document.open();
        document.write(payload);
        document.close();
        return;
      }
      var printBtn = document.getElementById('printBtn');
      var backBtn = document.getElementById('backBtn');
      if (printBtn) printBtn.addEventListener('click', function(){ window.print(); });
      if (backBtn) backBtn.addEventListener('click', function(){ window.location.href = backUrl || '/'; });
    })();
  </script>
</body>
</html>
